version: "3.9"

services:
  gigadoc:
    image: ws_gigadoc_cpu:latest
    restart: unless-stopped
    container_name: gigadoc
    network_mode: "host"
    entrypoint: "python3 ws_server.py -vvv --device=cpu --ip=0.0.0.0"

  ws_adapter:
    restart: unless-stopped
    build:      
      dockerfile: Dockerfile
      context: ./ws_adapter/
    container_name: ws_adapter
    volumes:
      - "./ws_adapter/:/usr/src/app/"
    network_mode: "host"
    env_file:
      - .env
    depends_on:
      - gigadoc

  telegram_bot:
    restart: unless-stopped
    build:      
      dockerfile: Dockerfile
      context: ./telegram_bot/
    container_name: telegram_bot
    volumes:
      - "./telegram_bot/:/app/"
    network_mode: "host"
    env_file:
      - .env
    depends_on:
      - ws_adapter