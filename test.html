<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цифровой тонометр - AI версия</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="overlay hidden" id="loadingOverlay">
            <div class="overlay-content">
                <div class="spinner"></div>
                <div class="progress-title" id="progressTitle">Обработка видео</div>
                <div class="progress-status" id="progressStatus">Подготовка...</div>
                
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                
                <div class="progress-steps">
                    <div class="step active" id="step1">
                        <div class="step-icon">📹</div>
                        <div class="step-text">Запись</div>
                    </div>
                    <div class="step" id="step2">
                        <div class="step-icon">📤</div>
                        <div class="step-text">Отправка</div>
                    </div>
                    <div class="step" id="step3">
                        <div class="step-icon">🤖</div>
                        <div class="step-text">AI анализ</div>
                    </div>
                    <div class="step" id="step4">
                        <div class="step-icon">✅</div>
                        <div class="step-text">Готово</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="header">
            <h1>🩺 <span class="ai">Цифровой-</span><span class="assistant">тонометр</span></h1>
            <p>Измерение артериального давления по видео с помощью искусственного интеллекта</p>
        </div>

        <div class="video-section">
            <div class="video-preview" id="videoPreview">
                <div class="video-placeholder">
                    <div class="video-icon">📹</div>
                    <div class="video-text">Нажмите кнопку для съемки</div>
                    <div class="video-hint">Запись автоматически остановится через 10 секунд</div>
                </div>
            </div>

            <div class="timer hidden" id="timer">⏱️ Осталось: 10 сек</div>

            <button class="record-button" id="recordButton">
                🎥 Начать съемку
            </button>
            
            <div class="controls hidden" id="controls"></div>
        </div>
        
        <div class="results-section hidden" id="resultsSection">
            <div class="results-header">
                <h2 id="resultsHeader">Результаты анализа</h2>
                <button class="new-recording-btn" id="newRecordingBtn">
                    🎥 Новое измерение
                </button>
            </div>
            <div class="results-content" id="resultsContent"></div>
        </div>

        <div class="error-notification hidden" id="errorNotification">
            <div class="error-content">
                <div class="error-icon">⚠️</div>
                <div class="error-message" id="errorMessage"></div>
                <button class="error-close-btn" id="errorCloseBtn">✕</button>
            </div>
        </div>
    </div>

    <script>
        const VIDEO_MIME_TYPE = 'video/webm';
        const RECORDING_DURATION = 10;
        
        const AI_SERVER_CONFIG = {
            baseUrl: 'https://model.pressure-monitor.ru',
            endpoints: {
                upload: '/upload',
                result: '/result'
            }
        };
        
        const ERROR_MESSAGES = {
            NotAllowedError: 'Доступ к камере запрещен. Разрешите доступ в настройках браузера.',
            NotFoundError: 'Камера не найдена. Проверьте подключение устройства.',
            NotReadableError: 'Камера занята другим приложения. Закройте другие приложения.',
            NotSupportedError: 'Ваш браузер не поддерживает запись видео.',
            OverconstrainedError: 'Камера не поддерживает запрошенные параметры.'
        };
        
        // DOM элементы
        const videoPreview = document.getElementById('videoPreview');
        const recordButton = document.getElementById('recordButton');
        const timer = document.getElementById('timer');
        const progressTitle = document.getElementById('progressTitle');
        const progressStatus = document.getElementById('progressStatus');
        const progressFill = document.getElementById('progressFill');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const resultsSection = document.getElementById('resultsSection');
        const resultsContent = document.getElementById('resultsContent');
        const newRecordingBtn = document.getElementById('newRecordingBtn');
        const errorNotification = document.getElementById('errorNotification');
        const errorMessage = document.getElementById('errorMessage');
        const errorCloseBtn = document.getElementById('errorCloseBtn');
        
        const steps = [
            document.getElementById('step1'),
            document.getElementById('step2'),
            document.getElementById('step3'),
            document.getElementById('step4')
        ];

        // Состояние приложения
        let mediaRecorder, recordedChunks = [], stream, timerInterval;
        let recordingTime = 0, currentTaskId = null;
        let resultCheckInterval = null, resultCheckAttempts = 0;
        
        // Константы
        const MAX_RESULT_ATTEMPTS = 10;
        const RESULT_CHECK_DELAY = 10000;
        const PROGRESS_STEPS = {
            RECORDING: 1,
            UPLOADING: 2, 
            ANALYZING: 3,
            COMPLETED: 4
        };
        
        const TIMEOUTS = {
            ERROR_NOTIFICATION: 8000,
            PROGRESS_HIDE: 2000,
            UPLOAD_DELAY: 1000
        };
        
        function showProgress() {
            loadingOverlay.classList.remove('hidden');
        }
        
        function hideProgress() {
            loadingOverlay.classList.add('hidden');
        }
        
        // Управление ошибками
        function showError(message) {
            errorMessage.textContent = message;
            errorNotification.classList.remove('hidden');
            setTimeout(hideError, TIMEOUTS.ERROR_NOTIFICATION);
        }
        
        function hideError() {
            errorNotification.classList.add('hidden');
        }
        
        function handleError(error) {
            console.error('❌ Ошибка:', error.message);
            
            return {
                userMessage: 'Произошла ошибка. Попробуйте еще раз.',
                userDetails: null
            };
        }
        
        function handleAIError(result) {
            console.error('❌ AI анализ завершился с ошибкой распознавания:', result);
            
            const userMessage = result.message || result.error || 'Не удалось распознать лицо или палец на видео';
            const userDetails = result.details || 'Возможные причины: плохое освещение, лицо/палец не в кадре, размытое изображение';
            
            return { userMessage, userDetails };
        }
        
        // Управление прогрессом
        function updateProgress(step, status, progressPercent) {
            progressStatus.textContent = status;
            progressFill.style.width = `${progressPercent}%`;
            
            steps.forEach((stepElement, index) => {
                let stepClass = 'step';
                
                if (index < step - 1) {
                    stepClass += ' completed';
                } else if (index === step - 1) {
                    stepClass += ' active';
                }
                
                stepElement.className = stepClass;
            });
        }
        
        // AI анализ и получение результатов
        async function autoCheckResult() {
            if (!currentTaskId) return;

            try {
                resultCheckAttempts++;
                console.log(`🔍 Попытка ${resultCheckAttempts}/${MAX_RESULT_ATTEMPTS} для задачи ${currentTaskId}`);
                
                const result = await fetchAndParseResult();
                await handleAIResult(result);
                
            } catch (error) {
                await handleCheckError(error);
            }
        }
        
        async function fetchAndParseResult() {
            const resultResponse = await fetch(`${AI_SERVER_CONFIG.baseUrl}${AI_SERVER_CONFIG.endpoints.result}/${currentTaskId}`);
            
            if (!resultResponse.ok) {
                throw new Error(`HTTP ${resultResponse.status}: ${resultResponse.statusText}`);
            }

            const responseText = await resultResponse.text();
            if (!responseText || responseText.trim() === '') {
                throw new Error('Сервер вернул пустой ответ');
            }
            
            try {
                return JSON.parse(responseText);
            } catch (parseError) {
                console.error('❌ Ошибка парсинга JSON:', parseError.message, 'Ответ:', responseText);
                throw new Error(`Ошибка парсинга JSON: ${parseError.message}. Ответ сервера: "${responseText}"`);
            }
        }
        
        async function handleAIResult(result) {
            console.log('✅ Результат AI анализа получен:', result);

            if (result.status === 'ok') {
                stopAutoCheck();
                updateProgress(PROGRESS_STEPS.COMPLETED, 'Результат готов!', 100);
                showResults(result);
                setTimeout(hideProgress, TIMEOUTS.PROGRESS_HIDE);
            } else if (result.status === 'fail') {
                stopAutoCheck();
                hideProgress();
                const { userMessage, userDetails } = handleAIError(result);
                showErrorResults(userMessage, userDetails);
            } else {
                throw new Error(`Статус обработки не OK: ${result.status}`);
            }
        }
        
        async function handleCheckError(error) {
            console.error(`❌ Ошибка автоматической проверки (попытка ${resultCheckAttempts}):`, error.message);
            
            if (error.message.includes('Сервер вернул пустой ответ')) {
                if (resultCheckAttempts < MAX_RESULT_ATTEMPTS) return;
                
                console.error('❌ Превышено количество попыток получения результата:', `${resultCheckAttempts}/${MAX_RESULT_ATTEMPTS} для задачи ${currentTaskId}`);
                stopAutoCheck();
                hideProgress();
                showErrorResults(
                    'Модель не смогла обработать видео',
                    'Возможные причины: видео слишком короткое, плохое качество или технические проблемы на сервере'
                );
            } else {
                console.error('❌ Ошибка сети/сервера при получении результата:', error.message);
                stopAutoCheck();
                hideProgress();
                showErrorResults(
                    'Ошибка соединения с сервером',
                    'Проверьте интернет-соединение и попробуйте еще раз'
                );
            }
        }

        function startAutoCheck() {
            clearInterval(resultCheckInterval);
            resultCheckAttempts = 0;
            resultCheckInterval = setInterval(autoCheckResult, RESULT_CHECK_DELAY);
            updateProgress(PROGRESS_STEPS.ANALYZING, 'AI анализирует видео...', 75);
        }

        function stopAutoCheck() {
            clearInterval(resultCheckInterval);
            resultCheckInterval = null;
        }

        function updateTimer() {
            const remaining = RECORDING_DURATION - recordingTime;
            if (remaining <= 0) {
                stopRecording();
                return;
            }
            timer.textContent = `⏱️ Осталось: ${remaining} сек`;
            recordingTime++;
        }
        
        // Запись видео
        function setupMediaRecorder() {
            mediaRecorder = new MediaRecorder(stream, { mimeType: VIDEO_MIME_TYPE });
            recordedChunks = [];
            
            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };
            
            mediaRecorder.onstop = handleRecordingComplete;
        }
        
        function handleRecordingComplete() {
            const recordedVideo = createRecordedVideo();
            videoPreview.innerHTML = '';
            videoPreview.appendChild(recordedVideo);
            
            stopCameraStream();
            setTimeout(sendToAIAnalysis, TIMEOUTS.UPLOAD_DELAY);
        }
        
        function createRecordedVideo() {
            const blob = new Blob(recordedChunks, { type: VIDEO_MIME_TYPE });
            const videoUrl = URL.createObjectURL(blob);
            
            const recordedVideo = document.createElement('video');
            recordedVideo.src = videoUrl;
            recordedVideo.controls = true;
            recordedVideo.autoplay = false;
            recordedVideo.muted = true;
            recordedVideo.className = 'recorded-video';
            
            return recordedVideo;
        }
        
        function stopCameraStream() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        }
        
        async function startRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                stopRecording();
                return;
            }
            
            try {
                stream = await getCameraStream();
                setupVideoPreview();
                startRecordingProcess();
                
            } catch (error) {
                console.error('❌ Ошибка доступа к камере:', error.name, error.message);
                const errorMessage = ERROR_MESSAGES[error.name] || `Ошибка: ${error.message}`;
                showError(errorMessage);
                hideProgress();
            }
        }
        
        async function getCameraStream() {
            return await navigator.mediaDevices.getUserMedia({ 
                video: { 
                    width: { ideal: 1280 }, 
                    height: { ideal: 720 },
                    facingMode: 'user'
                }, 
                audio: false 
            });
        }
        
        function setupVideoPreview() {
            const video = document.createElement('video');
            video.srcObject = stream;
            video.autoplay = true;
            video.muted = true;
            video.playsInline = true;
            
            videoPreview.innerHTML = '';
            videoPreview.appendChild(video);
        }
        
        function startRecordingProcess() {
            currentTaskId = null;
            hideProgress();
            stopAutoCheck();
            setupMediaRecorder();
            
            mediaRecorder.start();
            recordingTime = 0;
            timerInterval = setInterval(updateTimer, 1000);
            
            recordButton.disabled = true;
            recordButton.textContent = '⏹️ Остановить запись';
            timer.classList.remove('hidden');
            videoPreview.classList.add('recording');
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            
            clearInterval(timerInterval);
            
            recordButton.disabled = false;
            recordButton.textContent = '🎥 Начать съемки';
            timer.classList.add('hidden');
            videoPreview.classList.remove('recording');
        }

        async function sendToAIAnalysis() {
            if (recordedChunks.length === 0) return;

            try {
                updateProgress(PROGRESS_STEPS.UPLOADING, 'Отправка видео на сервер...', 50);
                showProgress();

                const taskId = await uploadVideo();
                currentTaskId = taskId;
                console.log('✅ Видео загружено, ID задачи:', taskId);
                startAutoCheck();

            } catch (error) {
                console.error('❌ Ошибка отправки видео:', error.message);
                hideProgress();
                const { userMessage } = handleError(error);
                showError(userMessage);
            }
        }
        
        async function uploadVideo() {
            const formData = new FormData();
            const blob = new Blob(recordedChunks, { type: VIDEO_MIME_TYPE });
            formData.append('file', blob, 'video.webm');

            const uploadResponse = await fetch(`${AI_SERVER_CONFIG.baseUrl}${AI_SERVER_CONFIG.endpoints.upload}`, {
                method: 'POST',
                body: formData
            });

            if (!uploadResponse.ok) {
                throw new Error(`HTTP ${uploadResponse.status}: ${uploadResponse.statusText}`);
            }

            const uploadResult = await uploadResponse.text();
            console.log('📄 Ответ сервера загрузки:', uploadResult);
            
            if (!uploadResult || uploadResult.trim() === '') {
                throw new Error('Сервер загрузки вернул пустой ответ');
            }

            const taskId = uploadResult.trim();
            if (!taskId) {
                throw new Error('Не получен ID задачи от сервера');
            }

            return taskId;
        }
        
        // Отображение результатов
        function showErrorResults(errorMessage, errorDetails = null) {
            document.getElementById('resultsHeader').textContent = 'Ошибка анализа';
            
            const errorHTML = `
                <div class="error-simple">
                    <h3>⚠️ Ошибка анализа</h3>
                    <p>${errorMessage}</p>
                    ${errorDetails ? `<p><strong>Детали:</strong> <span class="error-details-text">${errorDetails}</span></p>` : ''}
                    <div class="suggestions">
                        <h4>Рекомендации:</h4>
                        <ul>
                            <li>Убедитесь, что палец хорошо виден на видео</li>
                            <li>Проверьте освещение - должно быть достаточно ярким</li>
                            <li>Держите камеру стабильно во время записи</li>
                            <li>Попробуйте записать видео заново</li>
                        </ul>
                    </div>
                </div>
            `;

            resultsContent.innerHTML = errorHTML;
            resultsSection.classList.remove('hidden');
            document.querySelector('.video-section').style.display = 'none';
        }

        function showResults(result) {
            document.getElementById('resultsHeader').textContent = 'Результаты анализа';
            
            const { upper_ap, lower_ap } = result;
            const { category } = getPressureCategory(upper_ap, lower_ap);

            const resultsHTML = `
                <div class="pressure-card">
                    <div class="pressure-title">Артериальное давление</div>
                    <div class="pressure-values">
                        <div class="pressure-item">
                            <div class="pressure-number pressure-${category.toLowerCase()}">${upper_ap}</div>
                            <div class="pressure-label">Систолическое (верхнее)</div>
                        </div>
                        <div class="pressure-item">
                            <div class="pressure-number pressure-${category.toLowerCase()}">${lower_ap}</div>
                            <div class="pressure-label">Диастолическое (нижнее)</div>
                        </div>
                    </div>
                    <div class="category-badge category-${category.toLowerCase()}">
                        ${category}
                    </div>
                </div>
            `;

            resultsContent.innerHTML = resultsHTML;
            resultsSection.classList.remove('hidden');
            document.querySelector('.video-section').style.display = 'none';
        }
        
        function getPressureCategory(upper_ap, lower_ap) {
            if (upper_ap >= 140 || lower_ap >= 90) {
                return { category: 'Повышенное', categoryColor: '#ff9800' };
            } else if (upper_ap >= 160 || lower_ap >= 100) {
                return { category: 'Высокое', categoryColor: '#f44336' };
            } else if (upper_ap < 90 || lower_ap < 60) {
                return { category: 'Пониженное', categoryColor: '#2196f3' };
            } else {
                return { category: 'Нормальное', categoryColor: '#4caf50' };
            }
        }

        function startNewRecording() {
            resultsSection.classList.add('hidden');
            document.querySelector('.video-section').style.display = 'block';
            
            currentTaskId = null;
            recordedChunks = [];
            stopAutoCheck();
            hideProgress();
            
            videoPreview.innerHTML = `
                <div class="video-placeholder">
                    <div class="video-icon">📹</div>
                    <div class="video-text">Нажмите кнопку для съемки</div>
                    <div class="video-hint">Запись автоматически остановится через 10 секунд</div>
                </div>
            `;
            
            recordButton.disabled = false;
            recordButton.textContent = '🎥 Начать съемки';
        }
        
        // Event listeners
        recordButton.addEventListener('click', startRecording);
        newRecordingBtn.addEventListener('click', startNewRecording);
        errorCloseBtn.addEventListener('click', hideError);
        



    </script>
</body>
</html>
