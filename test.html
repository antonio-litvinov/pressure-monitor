<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цифровой тонометр - AI версия</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="overlay hidden" id="loadingOverlay">
            <div class="overlay-content">
                <div class="spinner"></div>
                <div class="progress-title" id="progressTitle">Обработка видео</div>
                <div class="progress-status" id="progressStatus">Подготовка...</div>
                
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                
                <div class="progress-steps">
                    <div class="step active" id="step1">
                        <div class="step-icon">📹</div>
                        <div class="step-text">Запись</div>
                    </div>
                    <div class="step" id="step2">
                        <div class="step-icon">📤</div>
                        <div class="step-text">Отправка</div>
                    </div>
                    <div class="step" id="step3">
                        <div class="step-icon">🤖</div>
                        <div class="step-text">AI анализ</div>
                    </div>
                    <div class="step" id="step4">
                        <div class="step-icon">✅</div>
                        <div class="step-text">Готово</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="header">
            <h1>🩺 <span class="ai">Цифровой-</span><span class="assistant">тонометр</span></h1>
            <p>Измерение артериального давления по видео с помощью искусственного интеллекта</p>
        </div>

        <div class="video-section">
            <div class="video-preview" id="videoPreview">
                <div class="video-placeholder">
                    <div class="video-icon">📹</div>
                    <div class="video-text">Нажмите кнопку для съемки</div>
                    <div class="video-hint">
                        Запись автоматически остановится через 10 секунд
                    </div>
                </div>
            </div>

            <div class="timer hidden" id="timer">⏱️ Осталось: 10 сек</div>

            <button class="record-button" id="recordButton">
                🎥 Начать съемку
            </button>
            
            <!-- Индикатор прогресса теперь находится в оверлее -->
            <div class="controls hidden" id="controls">
                <!-- Автоматический процесс - кнопки не нужны -->
            </div>
        </div>
        
        <!-- Блок для результатов -->
        <div class="results-section hidden" id="resultsSection">
            <div class="results-header">
                <h2>Результаты анализа</h2>
                <button class="new-recording-btn" id="newRecordingBtn">
                    🎥 Новое измерение
                </button>
            </div>
            <div class="results-content" id="resultsContent">
                <!-- Сюда будут добавляться результаты -->
            </div>
        </div>
    </div>

    <script>
        // Константы
        const VIDEO_MIME_TYPE = 'video/webm';
        const RECORDING_DURATION = 10; // секунд
        
        // Конфигурация AI сервера
        const AI_SERVER_CONFIG = {
            baseUrl: 'https://model.pressure-monitor.ru',
            endpoints: {
                upload: '/upload',
                result: '/result'
            }
        };
        
        const ERROR_MESSAGES = {
            NotAllowedError: 'Доступ к камере запрещен. Разрешите доступ в настройках браузера.',
            NotFoundError: 'Камера не найдена. Проверьте подключение устройства.',
            NotReadableError: 'Камера занята другим приложением. Закройте другие приложения.',
            NotSupportedError: 'Ваш браузер не поддерживает запись видео.',
            OverconstrainedError: 'Камера не поддерживает запрошенные параметры.'
        };
        
        // Элементы интерфейса
        const videoPreview = document.getElementById('videoPreview');
        const recordButton = document.getElementById('recordButton');
        const timer = document.getElementById('timer');
        const controls = document.getElementById('controls');
        
        // Элементы индикатора прогресса (теперь в оверлее)
        const progressTitle = document.getElementById('progressTitle');
        const progressStatus = document.getElementById('progressStatus');
        const progressFill = document.getElementById('progressFill');
        
        // Массив шагов для более чистого кода
        const steps = [
            document.getElementById('step1'),
            document.getElementById('step2'),
            document.getElementById('step3'),
            document.getElementById('step4')
        ];
        
        // Элементы оверлея
        const loadingOverlay = document.getElementById('loadingOverlay');
        
        // Элементы результатов
        const resultsSection = document.getElementById('resultsSection');
        const resultsContent = document.getElementById('resultsContent');
        const newRecordingBtn = document.getElementById('newRecordingBtn');

        let mediaRecorder;
        let recordedChunks = [];
        let stream;
        let timerInterval;
        let recordingTime = 0;
        let currentTaskId = null; // ID текущей задачи
        let resultCheckInterval = null; // Интервал для проверки результата
        let resultCheckAttempts = 0; // Счетчик попыток проверки
        const MAX_RESULT_ATTEMPTS = 10; // Максимум попыток
        const RESULT_CHECK_DELAY = 5000; // 5 секунд между попытками
        
        // Константы для шагов прогресса
        const PROGRESS_STEPS = {
            RECORDING: 1,
            UPLOADING: 2,
            ANALYZING: 3,
            COMPLETED: 4
        };
        
        // Функции для управления индикатором прогресса
        function showProgress() {
            // Показываем полноэкранный оверлей с прогрессом
            loadingOverlay.classList.remove('hidden');
        }
        
        function hideProgress() {
            // Скрываем оверлей
            loadingOverlay.classList.add('hidden');
        }
        
        function updateProgress(step, status, progressPercent) {
            // Обновляем статус
            progressStatus.textContent = status;
            
            // Обновляем прогресс-бар
            progressFill.style.width = `${progressPercent}%`;
            
            // Сбрасываем все шаги
            steps.forEach(stepElement => {
                stepElement.className = 'step';
            });
            
            // Обновляем активный шаг и завершенные
            for (let i = 0; i < steps.length; i++) {
                if (i < step - 1) {
                    steps[i].className = 'step completed';
                } else if (i === step - 1) {
                    steps[i].className = 'step active';
                }
            }
        }

        // Автоматическая проверка результата
        async function autoCheckResult() {
            if (!currentTaskId) {
                console.log('❌ Нет активной задачи для автоматической проверки');
                return;
            }

            try {
                resultCheckAttempts++;
                console.log(`🔍 Попытка ${resultCheckAttempts}/${MAX_RESULT_ATTEMPTS} для задачи ${currentTaskId}`);
                
                const resultResponse = await fetch(`${AI_SERVER_CONFIG.baseUrl}${AI_SERVER_CONFIG.endpoints.result}/${currentTaskId}`, {
                    method: 'GET'
                });
                
                if (!resultResponse.ok) {
                    throw new Error(`HTTP ${resultResponse.status}: ${resultResponse.statusText}`);
                }

                // Получаем текст ответа
                const responseText = await resultResponse.text();
                
                // Проверяем, не пустой ли ответ
                if (!responseText || responseText.trim() === '') {
                    throw new Error('Сервер вернул пустой ответ');
                }
                
                // Пытаемся распарсить JSON
                let result;
                try {
                    result = JSON.parse(responseText);
                } catch (parseError) {
                    console.error('❌ Ошибка парсинга JSON:', parseError);
                    console.error('📄 Проблемный текст:', responseText);
                    throw new Error(`Ошибка парсинга JSON: ${parseError.message}. Ответ сервера: "${responseText}"`);
                }
                
                console.log('✅ Результат AI анализа получен:', result);

                if (result.status === 'ok') {
                    // Останавливаем автоматическую проверку
                    stopAutoCheck();
                    
                    // Обновляем прогресс - завершение
                    updateProgress(PROGRESS_STEPS.COMPLETED, 'Результат готов!', 100);
                    
                    // Показываем результаты
                    showResults(result);
                    
                    // Скрываем индикатор прогресса через 2 секунды
                    setTimeout(() => {
                        hideProgress();
                    }, 2000);
                } else {
                    throw new Error(`Статус обработки не OK: ${result.status}`);
                }

            } catch (error) {
                console.error(`❌ Ошибка автоматической проверки (попытка ${resultCheckAttempts}):`, error);
                
                if (error.message.includes('Сервер вернул пустой ответ')) {
                    // Если сервер вернул пустой ответ, продолжаем попытки
                    if (resultCheckAttempts < MAX_RESULT_ATTEMPTS) {
                        console.log(`⏳ Сервер еще не готов, пробуем через 5 сек...`);
                        return; // Продолжаем автоматическую проверку
                    } else {
                        // Достигнут максимум попыток
                        stopAutoCheck();
                        
                        // Скрываем индикатор прогресса при ошибке
                        hideProgress();
                    }
                } else {
                    // Другие ошибки - останавливаем автоматическую проверку
                    stopAutoCheck();
                    
                    // Скрываем индикатор прогресса при ошибке
                    hideProgress();
                }
            }
        }

        // Запустить автоматическую проверку результата
        function startAutoCheck() {
            if (resultCheckInterval) {
                clearInterval(resultCheckInterval);
            }
            
            resultCheckAttempts = 0;
            resultCheckInterval = setInterval(autoCheckResult, RESULT_CHECK_DELAY);
            
            // Обновляем прогресс - AI анализ
            updateProgress(PROGRESS_STEPS.ANALYZING, 'AI анализирует видео...', 75);
        }

        // Остановить автоматическую проверку результата
        function stopAutoCheck() {
            if (resultCheckInterval) {
                clearInterval(resultCheckInterval);
                resultCheckInterval = null;
            }
        }

        // Обновить таймер
        function updateTimer() {
            const remaining = RECORDING_DURATION - recordingTime;
            if (remaining <= 0) {
                stopRecording();
                return;
            }
            timer.textContent = `⏱️ Осталось: ${remaining} сек`;
            recordingTime++;
        }

        // Настройка MediaRecorder
        function setupMediaRecorder() {
            mediaRecorder = new MediaRecorder(stream, { mimeType: VIDEO_MIME_TYPE });
            recordedChunks = [];
            
            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };
            
            mediaRecorder.onstop = handleRecordingComplete;
        }
        
        // Обработка завершения записи
        function handleRecordingComplete() {
            const blob = new Blob(recordedChunks, { type: VIDEO_MIME_TYPE });
            const videoUrl = URL.createObjectURL(blob);
            
            // Показываем записанное видео
            const recordedVideo = document.createElement('video');
            recordedVideo.src = videoUrl;
            recordedVideo.controls = true;
            recordedVideo.autoplay = false;
            recordedVideo.muted = true;
            recordedVideo.className = 'recorded-video';
            
            videoPreview.innerHTML = '';
            videoPreview.appendChild(recordedVideo);
            
            // Останавливаем поток камеры
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            
            // Показываем элементы управления
            controls.classList.remove('hidden');
            
            // Автоматически отправляем видео на анализ
            setTimeout(() => {
                sendToAIAnalysis();
            }, 1000); // Небольшая задержка для лучшего UX
        }
        
        // Начать/остановить запись
        async function startRecording() {
            // Если запись уже идет, останавливаем её
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                stopRecording();
                return;
            }
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 1280 }, 
                        height: { ideal: 720 },
                        facingMode: 'user'
                    }, 
                    audio: false 
                });
                
                const video = document.createElement('video');
                video.srcObject = stream;
                video.autoplay = true;
                video.muted = true;
                video.playsInline = true;
                
                // Очищаем контейнер и добавляем видео
                videoPreview.innerHTML = '';
                videoPreview.appendChild(video);
                
                // Сбрасываем состояние при новой записи
                currentTaskId = null;
                
                // Скрываем индикатор прогресса
                hideProgress();
                
                // Останавливаем автоматическую проверку результата
                stopAutoCheck();
                
                // Настройка MediaRecorder
                setupMediaRecorder();
                
                // Начинаем запись
                mediaRecorder.start();
                recordingTime = 0;
                timerInterval = setInterval(updateTimer, 1000);
                
                // Обновляем UI
                recordButton.disabled = true;
                recordButton.textContent = '⏹️ Остановить запись';
                timer.classList.remove('hidden');
                videoPreview.classList.add('recording');
                
            } catch (error) {
                console.error('Ошибка доступа к камере:', error);
                const errorMessage = ERROR_MESSAGES[error.name] || `Ошибка: ${error.message}`;
                
                // Показываем пользователю понятное сообщение об ошибке
                alert(errorMessage);
                
                // Скрываем индикатор прогресса при ошибке
                hideProgress();
            }
        }

        // Остановить запись
        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            
            if (timerInterval) {
                clearInterval(timerInterval);
            }
            
            // Обновляем UI
            recordButton.disabled = false;
            recordButton.textContent = '🎥 Начать съемку';
            timer.classList.add('hidden');
            videoPreview.classList.remove('recording');
            
            // Прогресс не показываем на этапе записи
        }

        // Отправить видео на AI анализ
        async function sendToAIAnalysis() {
            if (recordedChunks.length === 0) {
                return;
            }

            try {
                // Обновляем прогресс - отправка
                updateProgress(PROGRESS_STEPS.UPLOADING, 'Отправка видео на сервер...', 50);
                // Показываем прелоадер
                showProgress();
                
                // Кнопка отправки больше не нужна, так как отправка автоматическая

                // Создаем FormData с видео
                const formData = new FormData();
                const blob = new Blob(recordedChunks, { type: VIDEO_MIME_TYPE });
                formData.append('file', blob, 'video.webm');

                // Отправляем на AI сервер
                const uploadResponse = await fetch(`${AI_SERVER_CONFIG.baseUrl}${AI_SERVER_CONFIG.endpoints.upload}`, {
                    method: 'POST',
                    body: formData
                });

                if (!uploadResponse.ok) {
                    throw new Error(`HTTP ${uploadResponse.status}: ${uploadResponse.statusText}`);
                }

                const uploadResult = await uploadResponse.text();
                console.log('📄 Текст ответа загрузки:', uploadResult);
                
                // Проверяем, не пустой ли ответ
                if (!uploadResult || uploadResult.trim() === '') {
                    throw new Error('Сервер загрузки вернул пустой ответ');
                }

                // Извлекаем ID задачи
                const taskId = uploadResult.trim();
                if (!taskId) {
                    throw new Error('Не получен ID задачи от сервера');
                }

                // Сохраняем ID задачи и логируем в консоль
                currentTaskId = taskId;
                console.log(`✅ Видео загружено! ID задачи: ${taskId}`);
                
                // Запускаем автоматическую проверку результата
                startAutoCheck();

            } catch (error) {
                console.error('Ошибка отправки видео:', error);
                
                // Скрываем индикатор прогресса при ошибке
                hideProgress();
            } finally {
                // Кнопка отправки больше не нужна, так как отправка автоматическая
            }
        }

        // Показать результаты AI анализа
        function showResults(result) {
            const { upper_ap, lower_ap } = result;
            
            // Определяем категорию давления
            let category = 'Нормальное';
            let categoryColor = '#4caf50';
            
            if (upper_ap >= 140 || lower_ap >= 90) {
                category = 'Повышенное';
                categoryColor = '#ff9800';
            } else if (upper_ap >= 160 || lower_ap >= 100) {
                category = 'Высокое';
                categoryColor = '#f44336';
            } else if (upper_ap < 90 || lower_ap < 60) {
                category = 'Пониженное';
                categoryColor = '#2196f3';
            }

            // Создаем HTML для результатов
            const resultsHTML = `
                <div class="pressure-card">
                    <div class="pressure-title">Артериальное давление</div>
                    
                    <div class="pressure-values">
                        <div class="pressure-item">
                            <div class="pressure-number" style="color: ${categoryColor};">${upper_ap}</div>
                            <div class="pressure-label">Систолическое (верхнее)</div>
                        </div>
                        <div class="pressure-item">
                            <div class="pressure-number" style="color: ${categoryColor};">${lower_ap}</div>
                            <div class="pressure-label">Диастолическое (нижнее)</div>
                        </div>
                    </div>
                    
                    <div class="category-badge" style="background: ${categoryColor};">
                        ${category}
                    </div>
                </div>
            `;

            // Показываем секцию результатов
            resultsContent.innerHTML = resultsHTML;
            resultsSection.classList.remove('hidden');
            
            // Полностью скрываем видео-секцию
            document.querySelector('.video-section').style.display = 'none';
        }

        // Функция для начала нового измерения
        function startNewRecording() {
            // Скрываем секцию результатов
            resultsSection.classList.add('hidden');
            
            // Возвращаем видео-секцию
            document.querySelector('.video-section').style.display = 'block';
            
            // Сбрасываем состояние
            currentTaskId = null;
            recordedChunks = [];
            
            // Останавливаем автоматическую проверку результата
            stopAutoCheck();
            
            // Скрываем индикатор прогресса
            hideProgress();
            
            // Возвращаем видео-превью в исходное состояние
            videoPreview.innerHTML = `
                <div class="video-placeholder">
                    <div class="video-icon">📹</div>
                    <div class="video-text">Нажмите кнопку для съемки</div>
                    <div class="video-hint">
                        Запись автоматически остановится через 10 секунд
                    </div>
                </div>
            `;
            
            // Сбрасываем кнопку записи
            recordButton.disabled = false;
            recordButton.textContent = '🎥 Начать съемки';
        }
        
        // Обработчики событий
        recordButton.addEventListener('click', startRecording);
        newRecordingBtn.addEventListener('click', startNewRecording);

        // Инициализация
    </script>
</body>
</html>
