<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Цифровой тонометр - AI версия</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css?v=1.0.1">
</head>
<body>
    <div class="container">
        <div class="overlay hidden" id="loadingOverlay">
            <div class="overlay-content">
                <div class="spinner"></div>
                <div class="progress-title" id="progressTitle">Обработка видео</div>
                <div class="progress-status" id="progressStatus">Подготовка...</div>
                
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                
                <div class="progress-steps">
                    <div class="step active" id="step1">
                        <div class="step-icon">📹</div>
                        <div class="step-text">Запись</div>
                    </div>
                    <div class="step" id="step2">
                        <div class="step-icon">📤</div>
                        <div class="step-text">Отправка</div>
                    </div>
                    <div class="step" id="step3">
                        <div class="step-icon">🤖</div>
                        <div class="step-text">AI анализ</div>
                    </div>
                    <div class="step" id="step4">
                        <div class="step-icon">✅</div>
                        <div class="step-text">Готово</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="header">
            <h1>🩺 <span class="ai">Цифровой </span><span class="assistant">тонометр</span></h1>
            <p>Измерение артериального давления по видео с помощью искусственного интеллекта</p>
        </div>

        <div class="video-section">
            <div class="video-preview" id="videoPreview">
                <div class="video-placeholder">
                    <div class="video-icon">📹</div>
                    <div class="video-text">Подготовка камеры...</div>
                    <div class="video-hint">Нажмите "Начать запись" когда будете готовы</div>
                </div>
            </div>

            <div class="timer hidden" id="timer">⏱️ Осталось: 10 сек</div>

            <button class="record-button" id="recordButton">
                🎥 Начать запись
            </button>
            
            <div class="controls hidden" id="controls"></div>
        </div>
        
        <div class="results-section hidden" id="resultsSection">
            <div class="results-header">
                <h2 id="resultsHeader">Результаты анализа</h2>
                <button class="new-recording-btn" id="newRecordingBtn">
                    🎥 Новое измерение
                </button>
            </div>
            <div class="results-content" id="resultsContent"></div>
        </div>

        <div class="error-notification hidden" id="errorNotification">
            <div class="error-content">
                <div class="error-icon">⚠️</div>
                <div class="error-message" id="errorMessage"></div>
                <button class="error-close-btn" id="errorCloseBtn">✕</button>
            </div>
        </div>
    </div>

    <script>
        // ===== КОНСТАНТЫ КОНФИГУРАЦИИ =====
        
        // Определяем поддерживаемый формат видео
        function getSupportedVideoMimeType() {
            const types = [
                'video/mp4; codecs="avc1.42E01E"',  // MP4 с H.264 - лучшая поддержка iOS
                'video/mp4',                         // MP4 без codecs
                'video/webm; codecs="vp8"',          // WebM с VP8
                'video/webm'                         // WebM без codecs
            ];
            
            for (const type of types) {
                if (MediaRecorder.isTypeSupported(type)) {
                    console.log('✅ Поддерживаемый MIME type:', type);
                    return type;
                }
            }
            
            console.warn('⚠️ MediaRecorder не поддерживается в этом браузере');
            return null;
        }
        
        const VIDEO_MIME_TYPE = getSupportedVideoMimeType();
        
        // Длительность записи видео в секундах
        const RECORDING_DURATION = 10;
        
        // Конфигурация AI сервера для анализа видео
        const AI_SERVER_CONFIG = {
            baseUrl: 'https://api.pressure-monitor.ru',
            endpoints: {
                upload: '/upload',    // Эндпоинт для загрузки видео
                result: '/result'     // Эндпоинт для получения результата анализа
            }
        };
        
        // Проверяем поддержку MediaRecorder API
        function checkMediaRecorderSupport() {
            if (typeof MediaRecorder === 'undefined') {
                return {
                    supported: false,
                    message: 'MediaRecorder API не поддерживается в этом браузере. Обновите браузер или используйте Safari на iOS 14.3+'
                };
            }
            
            if (!VIDEO_MIME_TYPE) {
                return {
                    supported: false,
                    message: 'Запись видео не поддерживается в этом браузере. Используйте Safari на iOS 14.3+ или Chrome/Firefox'
                };
            }
            
            return { supported: true, message: null };
        }
        
        // Сообщения об ошибках доступа к камере для разных типов ошибок
        const ERROR_MESSAGES = {
            NotAllowedError: 'Доступ к камере запрещен. Разрешите доступ в настройках браузера.',
            NotFoundError: 'Камера не найдена. Проверьте подключение устройства.',
            NotReadableError: 'Камера недоступна. Закройте другие приложения, использующие камеру.',
            NotSupportedError: 'Ваш браузер не поддерживает запись видео.',
            OverconstrainedError: 'Камера не поддерживает запрошенные параметры.',
            SecurityError: 'Ошибка безопасности. Убедитесь, что сайт работает по HTTPS.',
            AbortError: 'Операция была прервана. Попробуйте еще раз.'
        };

        const videoPreview = document.getElementById('videoPreview');
        const recordButton = document.getElementById('recordButton');
        const timer = document.getElementById('timer');
        const controls = document.getElementById('controls');

        const progressTitle = document.getElementById('progressTitle');
        const progressStatus = document.getElementById('progressStatus');
        const progressFill = document.getElementById('progressFill');
        const steps = [
            document.getElementById('step1'),
            document.getElementById('step2'),
            document.getElementById('step3'),
            document.getElementById('step4')
        ];
        const loadingOverlay = document.getElementById('loadingOverlay');

        const resultsSection = document.getElementById('resultsSection');
        const resultsContent = document.getElementById('resultsContent');
        const newRecordingBtn = document.getElementById('newRecordingBtn');

        const errorNotification = document.getElementById('errorNotification');
        const errorMessage = document.getElementById('errorMessage');
        const errorCloseBtn = document.getElementById('errorCloseBtn');

        // ===== ПЕРЕМЕННЫЕ СОСТОЯНИЯ =====
        
        // Объекты для работы с записью видео
        let mediaRecorder, recordedChunks = [], stream, timerInterval;
        
        // Состояние записи и обработки
        let recordingTime = 0, currentTaskId = null;
        
        // Состояние автоматической проверки результата
        let resultCheckInterval = null, resultCheckAttempts = 0;
        
        // Константы для автоматической проверки результата
        const MAX_RESULT_ATTEMPTS = 10, RESULT_CHECK_DELAY = 5000;
        
        // Константы для отслеживания этапов обработки
        const PROGRESS_STEPS = {
            RECORDING: 1,    // Запись видео
            UPLOADING: 2,    // Загрузка на сервер
            ANALYZING: 3,    // AI анализ
            COMPLETED: 4     // Завершено
        };
        
        // Показывает оверлей с прогрессом загрузки
        function showProgress() {
            loadingOverlay.classList.remove('hidden');
        }
        
        // Скрывает оверлей с прогрессом загрузки
        function hideProgress() {
            loadingOverlay.classList.add('hidden');
        }
        
        // ===== УПРАВЛЕНИЕ ОШИБКАМИ =====
        
        // Показывает уведомление об ошибке пользователю
        function showError(message) {
            errorMessage.textContent = message;
            errorNotification.classList.remove('hidden');
            
            // Автоматически скрываем уведомление через 8 секунд
            setTimeout(hideError, 8000);
        }
        
        // Скрывает уведомление об ошибке
        function hideError() {
            errorNotification.classList.add('hidden');
        }
        
        // Обрабатывает общие ошибки (сетевые, HTTP, загрузка видео)
        function handleError(error) {
            console.error('❌ Ошибка:', error.message);
            
            return {
                userMessage: 'Произошла ошибка. Попробуйте еще раз.',
                userDetails: null
            };
        }
        
        // Обрабатывает ошибки AI анализа (когда status=fail)
        function handleAIError(result) {
            console.error('❌ AI анализ завершился с ошибкой распознавания:', result);
            
            // Формируем основное сообщение об ошибке
            const userMessage = result.message || result.error || 'Не удалось распознать лицо на видео';
            let userDetails = result.details || 'Возможные причины: плохое освещение, лицо не в кадре, размытое изображение';
            
            // Добавляем технический текст ошибки от сервера в скобочках
            if (result.error_text) {
                userDetails += ` (${result.error_text})`;
            }
            
            return { userMessage, userDetails };
        }
        
        // Обновляет прогресс-бар и визуальные индикаторы шагов
        function updateProgress(step, status, progressPercent) {
            // Обновляем текст статуса и ширину прогресс-бара
            progressStatus.textContent = status;
            progressFill.style.width = `${progressPercent}%`;

            // Обновляем классы шагов для визуализации прогресса
            steps.forEach((stepElement, index) => {
                if (index < step - 1) {
                    // Завершённые шаги
                    stepElement.className = 'step completed';
                } else if (index === step - 1) {
                    // Текущий активный шаг
                    stepElement.className = 'step active';
                } else {
                    // Оставшиеся шаги
                    stepElement.className = 'step';
                }
            });
        }

        // Автоматически проверяет результат обработки видео на сервере
        async function autoCheckResult() {
            if (!currentTaskId) {
                return;
            }

            try {
                resultCheckAttempts++;
                console.log(`🔍 Попытка ${resultCheckAttempts}/${MAX_RESULT_ATTEMPTS} для задачи ${currentTaskId}`);
                
                const resultResponse = await fetch(`${AI_SERVER_CONFIG.baseUrl}${AI_SERVER_CONFIG.endpoints.result}/${currentTaskId}`, {
                    method: 'GET'
                });
                
                if (!resultResponse.ok) {
                    throw new Error(`HTTP ${resultResponse.status}: ${resultResponse.statusText}`);
                }

                // Получаем текст ответа
                const responseText = await resultResponse.text();
                
                // Проверяем, не пустой ли ответ
                if (!responseText || responseText.trim() === '') {
                    throw new Error('Сервер вернул пустой ответ');
                }
                
                // Пытаемся распарсить JSON
                let result;
                try {
                    result = JSON.parse(responseText);
                } catch (parseError) {
                    console.error('❌ Ошибка парсинга JSON:', parseError.message, 'Ответ:', responseText);
                    throw new Error(`Ошибка парсинга JSON: ${parseError.message}. Ответ сервера: "${responseText}"`);
                }
                
                console.log('✅ Результат AI анализа получен:', result);

                if (result.status === 'ok') {
                    // Останавливаем автоматическую проверку
                    stopAutoCheck();
                    
                    // Обновляем прогресс - завершение
                    updateProgress(PROGRESS_STEPS.COMPLETED, 'Результат готов!', 100);
                    
                    // Показываем результаты
                    showResults(result);
                    
                    // Скрываем индикатор прогресса через 2 секунды
                    setTimeout(() => {
                        hideProgress();
                    }, 2000);
                } else if (result.status === 'fail') {
                    // Тип 2: Модель не смогла распознать лицо или проблемы с освещением
                    stopAutoCheck();
                    hideProgress();
                    
                    const { userMessage, userDetails } = handleAIError(result);
                    showErrorResults(userMessage, userDetails);
                } else {
                    throw new Error(`Статус обработки не OK: ${result.status}`);
                }

            } catch (error) {
                console.error(`❌ Ошибка автоматической проверки (попытка ${resultCheckAttempts}):`, error.message);
                
                if (error.message.includes('Сервер вернул пустой ответ')) {
                    if (resultCheckAttempts < MAX_RESULT_ATTEMPTS) {
                        return;
                    } else {
                        // Тип 1: Исчерпаны попытки - модель не возвращает результат
                        console.error('❌ Превышено количество попыток получения результата:', `${resultCheckAttempts}/${MAX_RESULT_ATTEMPTS} для задачи ${currentTaskId}`);
                        
                        stopAutoCheck();
                        hideProgress();
                        showErrorResults(
                            'Модель не смогла обработать видео',
                            'Возможные причины: видео слишком короткое, плохое качество или технические проблемы на сервере'
                        );
                    }
                } else {
                    // Другие ошибки сети/сервера
                    console.error('❌ Ошибка сети/сервера при получении результата:', error.message);
                    
                    stopAutoCheck();
                    hideProgress();
                    showErrorResults(
                        'Ошибка соединения с сервером',
                        'Проверьте интернет-соединение и попробуйте еще раз'
                    );
                }
            }
        }

        // Запускает автоматическую проверку результата на сервере
        function startAutoCheck() {
            clearInterval(resultCheckInterval);
            resultCheckAttempts = 0;
            resultCheckInterval = setInterval(autoCheckResult, RESULT_CHECK_DELAY);
            updateProgress(PROGRESS_STEPS.ANALYZING, 'AI анализирует видео...', 75);
        }

        // Останавливает автоматическую проверку результата
        function stopAutoCheck() {
            clearInterval(resultCheckInterval);
            resultCheckInterval = null;
        }

        // Обновляет таймер обратного отсчета записи
        function updateTimer() {
            const remaining = RECORDING_DURATION - recordingTime;
            if (remaining <= 0) {
                stopRecording();
                return;
            }
            timer.textContent = `⏱️ Осталось: ${remaining} сек`;
            recordingTime++;
        }

        // Настраивает MediaRecorder для записи видео
        function setupMediaRecorder() {
            if (!VIDEO_MIME_TYPE) {
                showError('Запись видео не поддерживается в этом браузере');
                return;
            }
            
            try {
                // Настройки MediaRecorder с учетом iOS
                const options = {
                    mimeType: VIDEO_MIME_TYPE,
                    videoBitsPerSecond: 2500000  // 2.5 Mbps для лучшего качества на iOS
                };
                
                mediaRecorder = new MediaRecorder(stream, options);
                recordedChunks = [];
                
                // Сохраняем данные видео по мере их поступления
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data && event.data.size > 0) {
                        recordedChunks.push(event.data);
                        console.log('📹 Получен фрагмент видео:', event.data.size, 'байт');
                    }
                };
                
                // Обрабатываем ошибки записи
                mediaRecorder.onerror = (event) => {
                    console.error('❌ Ошибка MediaRecorder:', event.error);
                    showError('Ошибка записи видео. Попробуйте еще раз.');
                };
                
                // Обрабатываем завершение записи
                mediaRecorder.onstop = handleRecordingComplete;
                
                console.log('✅ MediaRecorder настроен с MIME type:', VIDEO_MIME_TYPE);
                
            } catch (error) {
                console.error('❌ Ошибка настройки MediaRecorder:', error.message);
                showError('Ошибка настройки записи видео. Ваш браузер может не поддерживать эту функцию.');
            }
        }
        
        // Обрабатывает завершение записи видео
        function handleRecordingComplete() {
            // Создаем blob из записанных фрагментов
            const blob = new Blob(recordedChunks, { type: VIDEO_MIME_TYPE });
            const videoUrl = URL.createObjectURL(blob);
            
            // Создаем элемент video для отображения записанного видео
            const recordedVideo = document.createElement('video');
            recordedVideo.src = videoUrl;
            recordedVideo.controls = true;
            recordedVideo.autoplay = false;
            recordedVideo.muted = true;
            recordedVideo.className = 'recorded-video';
            
            // Заменяем превью на записанное видео
            videoPreview.innerHTML = '';
            videoPreview.appendChild(recordedVideo);
            
            // Останавливаем поток камеры
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            
            controls.classList.remove('hidden');
            
            // Запускаем отправку на анализ через 1 секунду
            setTimeout(sendToAIAnalysis, 1000);
        }
        
        // Инициализирует камеру при загрузке страницы
        async function initializeCamera() {
            try {
                // Проверяем поддержку MediaRecorder перед инициализацией камеры
                const supportCheck = checkMediaRecorderSupport();
                if (!supportCheck.supported) {
                    showError(supportCheck.message);
                    return;
                }
                
                // Проверяем HTTPS для iOS
                if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
                    showError('Для работы с камерой требуется HTTPS. Пожалуйста, откройте сайт по адресу https://...');
                    return;
                }
                
                // Настройки камеры с учетом ограничений iOS
                const constraints = {
                    video: {
                        width: { ideal: 1280, max: 1920 },
                        height: { ideal: 720, max: 1080 },
                        facingMode: 'user',
                        frameRate: { ideal: 30, max: 60 }
                    },
                    audio: false
                };
                
                // Пробуем получить доступ к камере
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                
                const video = document.createElement('video');
                video.srcObject = stream;
                video.autoplay = true;
                video.muted = true;
                video.playsInline = true;
                video.controls = false;
                
                // Обработчики событий для iOS
                video.addEventListener('loadedmetadata', () => {
                    console.log('✅ Видео метаданные загружены');
                });
                
                video.addEventListener('canplay', () => {
                    console.log('✅ Видео готово к воспроизведению');
                });
                
                videoPreview.innerHTML = '';
                videoPreview.appendChild(video);
                
                setupMediaRecorder();
                
                // Обновляем текст кнопки
                recordButton.textContent = '🎥 Начать запись';
                recordButton.disabled = false;
                
                console.log('✅ Камера инициализирована');
                
            } catch (error) {
                console.error('❌ Ошибка доступа к камере:', error.name, error.message);
                
                // Специальная обработка для iOS Safari
                let errorMessage = ERROR_MESSAGES[error.name] || `Ошибка: ${error.message}`;
                
                if (error.name === 'NotSupportedError' || error.name === 'NotAllowedError') {
                    errorMessage = 'Ваш браузер не поддерживает запись видео. Используйте Safari на iOS 14.3+ или обновите браузер.';
                }
                
                showError(errorMessage);
            }
        }

        // Начинает запись видео
        async function startRecording() {
            // Если уже идет запись, игнорируем нажатие
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                return;
            }
            
            // Проверяем поддержку MediaRecorder
            if (!VIDEO_MIME_TYPE) {
                showError('Запись видео не поддерживается в этом браузере');
                return;
            }
            
            // Проверяем, что камера инициализирована
            if (!stream) {
                await initializeCamera();
                return;
            }
            
            // Проверяем, что MediaRecorder настроен
            if (!mediaRecorder) {
                setupMediaRecorder();
                if (!mediaRecorder) {
                    showError('Не удалось настроить запись видео');
                    return;
                }
            }
            
            try {
                currentTaskId = null;
                hideProgress();
                stopAutoCheck();
                
                // Очищаем предыдущие фрагменты
                recordedChunks = [];
                
                // Начинаем запись с интервалом для iOS
                mediaRecorder.start(1000); // Записываем фрагменты каждую секунду
                recordingTime = 0;
                timerInterval = setInterval(updateTimer, 1000);
                
                // Делаем кнопку неактивной и показываем статус записи
                recordButton.disabled = true;
                recordButton.textContent = '🎥 Идет запись...';
                recordButton.classList.add('recording');
                timer.classList.remove('hidden');
                videoPreview.classList.add('recording');
                
                console.log('✅ Запись видео начата');
                
            } catch (error) {
                console.error('❌ Ошибка начала записи:', error.message);
                
                // Специальные сообщения для разных типов ошибок
                let errorMessage = 'Ошибка начала записи. Попробуйте еще раз.';
                
                if (error.name === 'InvalidStateError') {
                    errorMessage = 'MediaRecorder не готов к записи. Попробуйте еще раз.';
                } else if (error.name === 'NotSupportedError') {
                    errorMessage = 'Запись видео не поддерживается. Используйте Safari на iOS 14.3+';
                }
                
                showError(errorMessage);
            }
        }

        // Останавливает запись видео
        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            
            clearInterval(timerInterval);
            
            recordButton.disabled = false;
            recordButton.textContent = '🎥 Начать запись';
            recordButton.classList.remove('recording');
            timer.classList.add('hidden');
            videoPreview.classList.remove('recording');
        }

        // Отправляет записанное видео на AI сервер для анализа
        async function sendToAIAnalysis() {
            if (recordedChunks.length === 0) return;

            try {
                updateProgress(PROGRESS_STEPS.UPLOADING, 'Отправка видео на сервер...', 50);
                showProgress();

                const formData = new FormData();
                const blob = new Blob(recordedChunks, { type: VIDEO_MIME_TYPE });
                formData.append('file', blob, 'video.webm');

                const uploadResponse = await fetch(`${AI_SERVER_CONFIG.baseUrl}${AI_SERVER_CONFIG.endpoints.upload}`, {
                    method: 'POST',
                    body: formData
                });

                if (!uploadResponse.ok) {
                    throw new Error(`HTTP ${uploadResponse.status}: ${uploadResponse.statusText}`);
                }

                const uploadResult = await uploadResponse.text();
                console.log('📄 Ответ сервера загрузки:', uploadResult);
                
                if (!uploadResult || uploadResult.trim() === '') {
                    throw new Error('Сервер загрузки вернул пустой ответ');
                }

                const taskId = uploadResult.trim();
                if (!taskId) {
                    throw new Error('Не получен ID задачи от сервера');
                }

                currentTaskId = taskId;
                console.log('✅ Видео загружено, ID задачи:', taskId);
                startAutoCheck();

            } catch (error) {
                console.error('❌ Ошибка отправки видео:', error.message);
                hideProgress();
                
                const { userMessage } = handleError(error);
                showError(userMessage);
            }
        }

        // Отображает результаты ошибки анализа
        function showErrorResults(errorMessage, errorDetails = null) {
            document.getElementById('resultsHeader').textContent = 'Ошибка анализа';
            
            const errorHTML = `
                <div class="error-simple">
                    <h3>⚠️ Ошибка анализа</h3>
                    <p>${errorMessage}</p>
                    ${errorDetails ? `<p><strong>Детали:</strong> <span class="error-details-text">${errorDetails}</span></p>` : ''}
                    <div class="suggestions">
                        <h4>Рекомендации:</h4>
                        <ul>
                            <li>Проверьте освещение - оно должно быть достаточно ярким</li>
                            <li>Держите камеру стабильно во время записи</li>
                            <li>Попробуйте записать видео заново</li>
                        </ul>
                    </div>
                </div>
            `;

            resultsContent.innerHTML = errorHTML;
            resultsSection.classList.remove('hidden');
            document.querySelector('.video-section').style.display = 'none';
        }

        // Отображает результаты анализа давления на экране
        function showResults(result) {
            document.getElementById('resultsHeader').textContent = 'Результаты анализа';
            
            const { upper_ap, lower_ap } = result;
            
            // Определяем категорию давления по медицинским стандартам
            let category = 'Нормальное', categoryColor = '#4caf50';
            
            if (upper_ap >= 140 || lower_ap >= 90) {
                category = 'Повышенное';
                categoryColor = '#ff9800';
            } else if (upper_ap >= 160 || lower_ap >= 100) {
                category = 'Высокое';
                categoryColor = '#f44336';
            } else if (upper_ap < 90 || lower_ap < 60) {
                category = 'Пониженное';
                categoryColor = '#2196f3';
            }

            const resultsHTML = `
                <div class="pressure-card">
                    <div class="pressure-title">Артериальное давление</div>
                    <div class="pressure-values">
                        <div class="pressure-item">
                            <div class="pressure-number" style="color: ${categoryColor};">${upper_ap}</div>
                            <div class="pressure-label">Систолическое (верхнее)</div>
                        </div>
                        <div class="pressure-item">
                            <div class="pressure-number" style="color: ${categoryColor};">${lower_ap}</div>
                            <div class="pressure-label">Диастолическое (нижнее)</div>
                        </div>
                    </div>
                    <div class="category-badge" style="background: ${categoryColor};">
                        ${category}
                    </div>
                </div>
            `;

            resultsContent.innerHTML = resultsHTML;
            resultsSection.classList.remove('hidden');
            document.querySelector('.video-section').style.display = 'none';
        }

        // Сбрасывает интерфейс для новой записи
        function startNewRecording() {
            resultsSection.classList.add('hidden');
            document.querySelector('.video-section').style.display = 'block';
            
            currentTaskId = null;
            recordedChunks = [];
            stopAutoCheck();
            hideProgress();
            
            // Останавливаем предыдущий поток камеры
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            
            // Показываем заглушку и инициализируем камеру заново
            videoPreview.innerHTML = `
                <div class="video-placeholder">
                    <div class="video-icon">📹</div>
                    <div class="video-text">Подготовка камеры...</div>
                    <div class="video-hint">Нажмите "Начать запись" когда будете готовы</div>
                </div>
            `;
            
            recordButton.disabled = true;
            recordButton.textContent = '🎥 Подготовка...';
            
            // Инициализируем камеру заново
            initializeCamera();
        }
        
        recordButton.addEventListener('click', startRecording);
        newRecordingBtn.addEventListener('click', startNewRecording);
        errorCloseBtn.addEventListener('click', hideError);

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            // Обновление CSS
            const link = document.querySelector('link[href*="styles.css"]');
            if (link) {
                link.href = link.href.split('?')[0] + '?v=' + Date.now();
            }
            
            // Проверяем поддержку браузера
            const supportCheck = checkMediaRecorderSupport();
            if (!supportCheck.supported) {
                showError(supportCheck.message);
                recordButton.disabled = true;
                recordButton.textContent = '❌ Не поддерживается';
                return;
            }
            
            // Проверяем HTTPS
            if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
                showError('Для работы с камерой требуется HTTPS. Пожалуйста, откройте сайт по адресу https://...');
                recordButton.disabled = true;
                recordButton.textContent = '❌ Требуется HTTPS';
                return;
            }
            
            // Инициализация камеры
            initializeCamera();
        });

    </script>
</body>
</html>
